name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install flake8

      - name: Run flake8 (syntax errors and undefined names)
        run: |
          cd robocache/python
          flake8 robocache --count --select=E9,F63,F7,F82 --show-source --statistics

  test-cpu:
    name: CPU Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy psutil setuptools wheel

      - name: Install RoboCache (CPU only, no CUDA extensions)
        working-directory: ./robocache
        run: |
          pip install -e . --no-build-isolation

      - name: Run CPU tests
        working-directory: ./robocache
        run: |
          pytest tests/ -v

      - name: Verify import
        # run inside robocache/ so the repo-root robocache/ directory does not
        # shadow the installed package as a namespace package
        working-directory: ./robocache
        run: |
          python -c "import robocache; print(f'RoboCache {robocache.__version__} imported')"
